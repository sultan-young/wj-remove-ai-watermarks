services:
  gpu-image-service:
    build: .
    image: gpu-image-service:1.0.0
    init: true
    gpus: all
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      PYTHON_BIN: /opt/venv/bin/python
      HF_HOME: /models
      DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: "8000"
    volumes:
      - ${MODEL_CACHE_HOST_PATH:-./model-cache}:/models
      - ./data:/data
